spring:
  datasource:
    url: jdbc:h2:mem:fabrinmarket;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

security:
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-bytes
    expiration: PT8H
    issuer: fabrinmarket-api-test
