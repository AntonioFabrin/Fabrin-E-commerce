services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/database/setup_completo.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
      - ./src/database/create_reviews.sql:/docker-entrypoint-initdb.d/02-reviews.sql:ro
      - ./src/database/update_orders.sql:/docker-entrypoint-initdb.d/03-orders.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3333
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_NAME: ecommerce
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3333:3333"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333
        BACKEND_INTERNAL_URL: http://backend:3333
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
      BACKEND_INTERNAL_URL: http://backend:3333
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  uploads_data:
