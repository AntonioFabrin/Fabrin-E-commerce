services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/setup_completo.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
      - ./src/database/create_reviews.sql:/docker-entrypoint-initdb.d/02-reviews.sql:ro
      - ./src/database/update_orders.sql:/docker-entrypoint-initdb.d/03-orders.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3333
      # Sobrescreve URLs/variáveis remotas eventualmente presentes no .env.
      # Dentro do Compose, o banco deve ser sempre o serviço local `db`.
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: 5432
      PGUSER: ecommerce
      PGPASSWORD: ecommerce
      PGDATABASE: ecommerce
      PGSSLMODE: disable
      DB_SSL: "false"
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_NAME: ecommerce
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3333:3333"
    volumes:
      - uploads_data:/app/uploads

  identity-backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_NAME: ecommerce
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET precisa estar definido no arquivo .env}
      JWT_EXPIRATION: PT8H
      JWT_ISSUER: fabrinmarket-api
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PRODUCT_STORAGE_PROVIDER: ${PRODUCT_STORAGE_PROVIDER:-local}
      PRODUCT_UPLOAD_DIR: /app/uploads/products
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_PRODUCTS_BUCKET: ${SUPABASE_PRODUCTS_BUCKET:-product-images}
    ports:
      - "8080:8080"
    volumes:
      - product_uploads_data:/app/uploads/products

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:3333
        IDENTITY_BACKEND_INTERNAL_URL: http://identity-backend:8080
        CATALOG_BACKEND_INTERNAL_URL: http://identity-backend:8080
    restart: unless-stopped
    depends_on:
      - backend
      - identity-backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:3333
      IDENTITY_BACKEND_INTERNAL_URL: http://identity-backend:8080
      CATALOG_BACKEND_INTERNAL_URL: http://identity-backend:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
  product_uploads_data:
